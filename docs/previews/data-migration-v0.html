<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数据库管理软件 · 数据迁移样稿</title>
  <style>
    :root{--primary:#006fff;--hover:#2052dd;--surface:#fff;--background:#f1f3f9;--text:#303133;--secondary:#68728c;--border:#dfe6f0;--pad:16px;--cell:10px;--gap:16px}
    *{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--background);font:12px/1.6 "Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif}
    button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-color:var(--primary)}button{cursor:pointer;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--text);padding:6px 14px;min-height:32px}button:hover{border-color:#a6caff;color:var(--primary)}button:disabled{cursor:not-allowed;color:#929bab;background:#f6f7fa;border-color:var(--border)}button.primary{background:var(--primary);border-color:var(--primary);color:white}button.primary:hover{background:var(--hover)}button.primary:disabled{background:#a5c7f9;border-color:#a5c7f9}button.text{border:0;background:transparent;padding:3px 6px;color:var(--primary)}button.danger{color:#bd3434;border-color:#ebcaca}input,select,textarea{border:1px solid var(--border);border-radius:4px;padding:6px 10px;color:var(--text);background:white;min-height:32px;max-width:100%}input[type=checkbox],input[type=radio]{accent-color:var(--primary);min-height:auto;padding:0;cursor:pointer}input[readonly]{background:#f7f8fa;color:var(--secondary)}textarea{resize:vertical;width:100%}h1,h2,h3,p{margin:0}h1{font-size:16px;font-weight:600}h2{font-size:14px;font-weight:600}h3{font-size:12px;font-weight:600}a{color:var(--primary);text-decoration:none}.muted{color:var(--secondary)}.small{font-size:12px}.mono,pre{font:12px/20px Consolas,monospace}.required{color:#bd3434;margin-right:4px}.chip{display:inline-block;border:1px solid #cddfff;background:#edf5ff;color:#165bb6;padding:1px 6px;border-radius:3px;white-space:nowrap}.chip.warn{background:#fff7e7;color:#8c5d12;border-color:#e7d5b5}.chip.bad{background:#fff0f0;color:#ad3434;border-color:#ebcaca}.chip.neutral{background:#f4f5f7;color:var(--secondary);border-color:var(--border)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:var(--gap)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}.panel{border:1px solid var(--border);border-radius:4px;background:var(--surface);min-width:0}.panel-title{padding:10px var(--pad);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#fafbfd}.panel-body{padding:var(--pad)}.notice{padding:9px 12px;border:1px solid #d4e4fa;border-radius:4px;background:#f1f7ff;color:#47678e}.notice.warn{border-color:#ebd8b6;background:#fff9ef;color:#825b22}.notice.bad{border-color:#ebcaca;background:#fff4f4;color:#a33333}.field{display:grid;gap:6px;margin-bottom:14px}.field:last-child{margin-bottom:0}.field input:not([type=checkbox]),.field select{width:100%}.labels{display:flex;gap:var(--gap);flex-wrap:wrap}.labels label{display:flex;align-items:center;gap:6px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left}th{background:#f6f8fb;color:var(--secondary);font-weight:500;white-space:nowrap}td,th{padding:var(--cell) 12px;border-bottom:1px solid var(--border)}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcff}td .text{white-space:nowrap}.nowrap{white-space:nowrap}.table-wrap select{min-width:140px}.table-wrap input:not([type=checkbox]){min-width:130px;width:100%}.toolbar{padding:10px var(--pad);border-bottom:1px solid var(--border)}.kv{display:grid;grid-template-columns:100px 1fr;gap:10px 16px}.kv dt{color:var(--secondary)}.kv dd{margin:0;overflow-wrap:anywhere}.empty{text-align:center;padding:32px 16px;color:var(--secondary)}
    .shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}.sidebar{background:white;border-right:1px solid var(--border);display:flex;flex-direction:column}.brand{height:50px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #eef1f6;font-size:14px;font-weight:600;white-space:nowrap}.brand img{width:28px;height:28px}.nav{padding:16px 0}.nav-item{display:flex;padding:14px 20px;align-items:center;gap:10px;color:#4a5264;width:100%;border:0;border-radius:0;min-height:46px;justify-content:flex-start;text-align:left}.nav-item.active{background:#edf5ff;color:var(--primary);border-left:3px solid var(--primary);padding-left:17px}.nav-icon{width:16px;display:inline-block;text-align:center;color:#8490a5}.sidebar-foot{margin-top:auto;padding:16px;color:var(--secondary);border-top:1px solid var(--border)}.workspace{min-width:0;display:flex;flex-direction:column;height:100vh}.topbar{height:50px;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border)}.breadcrumb{color:#8991a3}.breadcrumb span{color:var(--text)}.user{display:flex;gap:8px;align-items:center}.avatar{background:#eef2f8;padding:2px 8px;border-radius:4px;color:#68728c}.page{padding:20px 24px;overflow:auto;flex:1;min-height:0}.page-heading{margin-bottom:16px}.page-heading p{margin-top:4px}.sample-label{background:#f6f8fc;border:1px solid var(--border);padding:6px 12px;color:var(--secondary);margin-bottom:16px;border-radius:4px}.stepper{display:flex;margin-bottom:20px;gap:0;padding:16px;background:white;border:1px solid var(--border);border-radius:4px}.step{flex:1;display:flex;gap:8px;align-items:center;position:relative;border:0;padding:0 10px;background:transparent;border-radius:0;min-height:32px;color:var(--secondary);justify-content:flex-start}.step:after{content:"";height:1px;background:var(--border);width:16px;position:absolute;right:0;top:16px}.step:last-child:after{display:none}.step.active{color:var(--primary);font-weight:600}.step-num{display:inline-grid;place-items:center;border:1px solid #c9d1df;border-radius:50%;width:24px;height:24px;flex-shrink:0;font-weight:600;background:white}.step.active .step-num{background:var(--primary);border-color:var(--primary);color:white}.direction{display:flex;gap:8px;flex-wrap:wrap}.direction button{min-width:136px;text-align:left;padding:8px 12px}.direction button.selected{color:var(--primary);background:#edf5ff;border-color:var(--primary)}.connection-head{display:flex;align-items:center;gap:8px}.role{color:var(--primary);font-weight:600}.connection-meta{display:flex;gap:24px;padding-top:12px;margin-top:12px;border-top:1px solid #eef1f6}.connection-meta div{display:grid;gap:4px}.footer{min-height:64px;background:#fff;border-top:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex-shrink:0}.footer-actions{display:flex;align-items:center;gap:8px}.object-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:var(--gap)}.object-tree{padding:12px;background:white;border:1px solid var(--border);border-radius:4px}.object-tree button{display:block;width:100%;text-align:left;border:0;border-radius:3px;background:transparent;padding:8px 10px}.object-tree button.selected{background:#edf5ff;color:var(--primary)}.object-tree .tree-child{padding-left:24px}.mapping-foot{display:flex;gap:var(--gap);flex-wrap:wrap;padding:12px var(--pad);border-top:1px solid var(--border)}.mapping-foot .field{min-width:140px;flex:1;margin:0}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}.check-count{display:flex;align-items:center;gap:10px;padding:12px var(--pad);border:1px solid var(--border);background:#fff;border-radius:4px}.check-count strong{font-size:20px;font-weight:500}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);padding:0 16px}.tabs button{border:0;border-radius:0;padding:10px 0;min-width:32px}.tabs button.active{color:var(--primary);border-bottom:2px solid var(--primary)}.phase-row{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}.phase{background:#f3f5f8;color:var(--secondary);padding:6px 14px;border-radius:4px}.phase.active{color:#165bb6;background:#edf5ff}.detail-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}.detail-summary>div{border-right:1px solid var(--border);padding-left:16px}.detail-summary>div:last-child{border:0}.detail-summary strong{display:block;font-size:18px;font-weight:500;margin-top:6px}.log{font:12px/22px Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9fc;border:1px solid var(--border);padding:16px;color:#59657c}.tweaks-trigger{position:fixed;right:18px;bottom:80px;z-index:3;font-size:12px;color:var(--secondary);background:#fff}.tweaks{position:fixed;right:18px;bottom:122px;z-index:4;background:#fff;width:260px;border:1px solid var(--border);border-radius:4px;box-shadow:0 4px 16px #2436531a}.tweaks[hidden]{display:none}.tweaks .panel-body{display:grid;gap:12px}.density{display:flex;gap:4px}.density button{padding:5px 8px;flex:1}.density button.selected{color:var(--primary);border-color:var(--primary);background:#edf5ff}dialog{border:1px solid var(--border);border-radius:4px;width:min(1000px,calc(100vw - 32px));max-height:85vh;padding:0;color:var(--text);box-shadow:0 12px 40px #1a305522}dialog::backdrop{background:#1c293f55}dialog .dialog-content{padding:var(--pad);overflow:auto;max-height:65vh}dialog .dialog-footer{padding:12px var(--pad);border-top:1px solid var(--border);display:flex;justify-content:flex-end}pre{margin:0;padding:16px;background:#f7f9fc;overflow-x:auto;white-space:pre}.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:8;padding:10px 18px;max-width:90vw;border:1px solid #cddfff;border-radius:4px;background:white;box-shadow:0 4px 14px #24365314}.toast[hidden]{display:none}
    @media(min-width:1600px){.page{padding:24px 32px}.footer{padding:12px 32px}}
    @media(max-width:1050px){.shell{grid-template-columns:170px minmax(0,1fr)}.brand{font-size:12px;padding:0 10px;gap:6px}.page{padding:16px}.step{padding:0 5px;gap:5px}.step:after{display:none}.object-layout{grid-template-columns:150px minmax(0,1fr)}.detail-summary{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 16px}.grid2{grid-template-columns:1fr}.stepper{padding:10px;overflow-x:auto}.step{min-width:108px}.object-layout{grid-template-columns:1fr}.object-tree{display:flex;flex-wrap:wrap;gap:4px}.object-tree h3{width:100%}.object-tree button{width:auto}.object-tree .tree-child{padding-left:10px}.checks{gap:8px}.check-count{padding:8px;gap:6px;flex-wrap:wrap}.footer{padding:12px 16px}.footer>div:first-child{width:100%}.footer-actions{margin-left:auto}.tweaks-trigger{bottom:126px}.tweaks{bottom:168px}.connection-meta{flex-wrap:wrap}.page-heading{align-items:flex-start}.detail-summary strong{font-size:16px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="管理导航">
      <div class="brand"><img src="../../jd-dbms-ui/src/assets/images/logo.png" alt=""><span>数据库管理软件</span></div>
      <nav class="nav">
        <div class="nav-item"><span class="nav-icon" aria-hidden="true">▤</span>个人中心</div>
        <div class="nav-item"><span class="nav-icon" aria-hidden="true">▥</span>表结构对比</div>
        <button class="nav-item active" data-action="list"><span class="nav-icon" aria-hidden="true">⇄</span>数据迁移</button>
      </nav>
      <div class="sidebar-foot">管理页扩展样稿<br>不改变工作区共享资源树</div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">个人中心所在管理导航　/　<span>数据迁移</span></div><div class="user"><span class="chip neutral">UI 样稿 v0</span><span class="avatar">示例用户</span></div></header>
      <main class="page" id="page"></main>
      <footer class="footer" id="footer"></footer>
    </div>
  </div>
  <button class="tweaks-trigger" data-action="tweaks" aria-expanded="false" aria-controls="tweaks">样稿设置</button>
  <section class="tweaks" id="tweaks" hidden aria-label="样稿设置">
    <div class="panel-title"><h2>Tweaks</h2><button class="text" data-action="tweaks">关闭</button></div>
    <div class="panel-body"><div>间距密度（正文始终为 12px）</div><div class="density"><button data-density="compact">紧凑</button><button data-density="standard" class="selected">标准</button><button data-density="relaxed">宽松</button></div><p class="muted">仅用于评审，不进入正式界面。</p></div>
  </section>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="panel-title"><h2 id="dialog-title"></h2><button class="text" data-action="close-dialog" aria-label="关闭对话框">关闭</button></div><div class="dialog-content" id="dialog-content"></div><div class="dialog-footer"><button data-action="close-dialog">关闭</button></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    'use strict';
    const directions = ['DM → DM','DM → Oracle','Oracle → Oracle','Oracle → DM'];
    const steps = ['连接配置','选择对象','映射与策略','评估预检查','审阅并执行','结果与验收'];
    const objects = [
      {name:'CUSTOMERS',type:'表',note:'客户基础信息',rows:'待统计'},
      {name:'ORDERS',type:'表',note:'含主键、外键和索引',rows:'待统计'},
      {name:'ATTACHMENTS',type:'表',note:'含 BLOB / CLOB 大字段',rows:'待统计'},
      {name:'ORDER_ITEMS',type:'表',note:'依赖 ORDERS',rows:'待统计'},
      {name:'V_ORDER_SUMMARY',type:'视图',note:'需校验引用及目标编译',rows:'不适用'},
      {name:'PROC_SETTLEMENT',type:'过程',note:'需人工转换和编译校验',rows:'不适用'}
    ];
    const initialState = () => ({view:'wizard',step:0,direction:3,name:'业务模式迁移（示例）',scope:'结构与数据',source:'demo-source',target:'demo-target',schema:'APP_TARGET',selected:['CUSTOMERS','ORDERS','ATTACHMENTS'],filter:'',kind:'全部对象',strategy:'stop',batch:'500',commit:'500',threads:'2',memory:'8',reviewed:false,tab:'总览',runtime:'waiting',density:'standard'});
    const state = initialState();
    const escapeHtml = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pair = () => directions[state.direction].split(' → ');
    const chosen = () => objects.filter(o=>state.selected.includes(o.name));
    const blocked = () => state.scope !== '仅数据' && state.selected.includes('PROC_SETTLEMENT');
    const strategyLabel = () => ({stop:'发现同名对象时阻断（默认）',skip:'跳过同名对象',append:'兼容结构检查后追加数据',truncate:'清空目标表后写入',rebuild:'删除并重建目标对象'})[state.strategy];
    const canAdvance = () => state.step===0 ? Boolean(state.name.trim()&&state.source&&state.target) : state.step===1 ? state.selected.length>0 : state.step===2 ? Boolean(state.schema.trim()&&[state.batch,state.commit,state.threads,state.memory].every(v=>/^\d+$/.test(v)&&Number(v)>0)) : state.step===3 ? !blocked() : true;
    const sample = '<div class="sample-label">交互样稿 · 所有连接和对象均为示例；不连接数据库、不执行迁移。可点击步骤预览布局。</div>';
    const panel = (title,body,extra='') => `<section class="panel"><div class="panel-title"><h2>${title}</h2>${extra}</div><div class="panel-body">${body}</div></section>`;
    function connection(role,type,key){return panel(`<span class="connection-head"><span class="role">${role==='source'?'源端':'目标端'}</span><span class="chip neutral">${type}</span></span>`, `<div class="field"><label for="${role}">选择已保存的连接</label><select id="${role}" data-bind="${role}"><option value="">请选择连接</option><option value="demo-${role}" ${state[role]?'selected':''}>${type}${role==='source'?'源':'目标'}连接（示例）</option></select></div><div class="row between"><span class="muted">按需连接，不自动加载其他数据源</span><button data-action="connection" data-role="${role}">查看连接信息</button></div><div class="connection-meta"><div><span class="muted">数据库版本</span><span>待真实连接检测</span></div><div><span class="muted">字符集 / 权限</span><span>待预检查</span></div><div><span class="muted">连接状态</span><span class="chip neutral">示例 · 未连接</span></div></div>`);}
    function connectionStep(){const [source,target]=pair();return `<div class="stack">${panel('迁移基本信息', `<div class="grid2"><div class="field"><label for="task-name"><span class="required">*</span>任务名称</label><input id="task-name" data-bind="name" maxlength="80" value="${escapeHtml(state.name)}"></div><div class="field"><label for="scope">迁移范围</label><select id="scope" data-bind="scope">${['结构与数据','仅结构','仅数据'].map(v=>`<option ${state.scope===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>迁移方向</label><div class="direction">${directions.map((d,i)=>`<button data-direction="${i}" class="${state.direction===i?'selected':''}" aria-pressed="${state.direction===i}">${d}</button>`).join('')}</div><span class="muted">切换方向会使原预检查与执行确认失效；四个方向需分别验收。</span></div>`)}<div class="grid2">${connection('source',source)}${connection('target',target)}</div><div class="notice warn">一致性前提：全量离线迁移。执行前停止源端数据与结构变更，并禁止目标对象的业务并发写入。</div></div>`;}
    function visibleObjects(){return objects.filter(o=>(state.kind==='全部对象'||o.type===state.kind)&&o.name.toLowerCase().includes(state.filter.toLowerCase()));}
    function objectRows(){return visibleObjects().map(o=>`<tr><td><input type="checkbox" data-object="${o.name}" aria-label="选择 ${o.name}" ${state.selected.includes(o.name)?'checked':''}></td><td class="mono">${o.name}</td><td>${o.type}</td><td>${o.rows}</td><td>${o.note}</td><td><button class="text" data-action="object-info" data-object-name="${o.name}">详情</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有匹配的示例对象；调整搜索或对象类型。</td></tr>';}
    function objectStep(){return `<div class="stack"><div class="notice">默认排除系统模式。对象按需读取；搜索后“全选”仅选择当前筛选结果，不扩大迁移范围。</div><div class="object-layout"><aside class="object-tree"><h3 class="muted">源模式（示例）</h3><h3 style="padding:8px 10px">APP_SOURCE</h3>${['全部对象','表','视图','过程'].map(v=>`<button class="tree-child ${state.kind===v?'selected':''}" data-kind="${v}">${v}<span class="muted">　${v==='全部对象'?objects.length:objects.filter(o=>o.type===v).length}</span></button>`).join('')}</aside><section class="panel"><div class="toolbar row between"><div class="row"><input id="object-search" aria-label="搜索对象名称" placeholder="搜索对象名称" value="${escapeHtml(state.filter)}"><span id="selected-count" class="muted">已选择 ${state.selected.length} 个对象</span></div><button class="text" data-action="clear-selection">清空选择</button></div><div class="table-wrap"><table><thead><tr><th style="width:40px"><input id="select-visible" type="checkbox" aria-label="选择当前筛选结果"></th><th>对象名称</th><th>类型</th><th>估算行数</th><th>关注事项</th><th>操作</th></tr></thead><tbody id="object-rows">${objectRows()}</tbody></table></div><div class="toolbar muted">共 6 个示例对象 · 正式版提供服务端分页与加载反馈</div></section></div><div class="notice warn">依赖提醒：ORDER_ITEMS 的外键依赖 ORDERS。过程等复杂对象必须单独转换、审阅 SQL 并通过目标编译校验，不能按普通表直接搬运。</div></div>`;}
    function mappingStep(){const [source,target]=pair();const sourceText=source==='Oracle'?'VARCHAR2(120 CHAR)':'VARCHAR(120)';const targetText=target==='Oracle'?'VARCHAR2(120 CHAR)':'VARCHAR(120)';return `<div class="stack">${panel('模式与对象映射', `<div class="grid2"><div class="field"><label>源模式（只读示例）</label><input readonly value="APP_SOURCE"></div><div class="field"><label for="schema"><span class="required">*</span>目标模式</label><input id="schema" data-bind="schema" value="${escapeHtml(state.schema)}"></div></div><div class="row between"><span class="muted">表名、列名默认保留；单对象配置在正式版抽屉中编辑。</span><button data-action="ddl">查看 DDL 对照示意</button></div>`)}<section class="panel"><div class="panel-title"><h2>字段类型映射示例 · CUSTOMERS</h2><span class="muted">实际映射由元数据评估生成</span></div><div class="table-wrap"><table><thead><tr><th>源字段</th><th>${source} 源类型</th><th>${target} 目标类型</th><th>检查要点</th></tr></thead><tbody><tr><td class="mono">ID</td><td class="mono">NUMBER(18,0)</td><td class="mono">NUMBER(18,0)</td><td>精度与主键唯一性</td></tr><tr><td class="mono">NAME</td><td class="mono">${sourceText}</td><td class="mono">${targetText}</td><td>字符 / 字节长度、空字符串</td></tr><tr><td class="mono">CREATED_AT</td><td class="mono">TIMESTAMP(6)</td><td class="mono">TIMESTAMP(6)</td><td>精度与时区语义</td></tr></tbody></table></div></section>${panel('冲突与执行策略', `<div class="field"><label for="strategy">目标同名对象处理</label><select id="strategy" data-bind="strategy">${['stop','skip','append','truncate','rebuild'].map(v=>`<option value="${v}" ${state.strategy===v?'selected':''}>${({stop:'发现同名对象时阻断（默认）',skip:'跳过同名对象',append:'兼容结构检查后追加数据',truncate:'清空目标表后写入（危险）',rebuild:'删除并重建目标对象（危险）'})[v]}</option>`).join('')}</select></div>${['truncate','rebuild'].includes(state.strategy)?`<div class="notice bad">危险策略：可能不可恢复地改变 ${escapeHtml(state.schema)} 中的 ${state.selected.length} 个对象。正式执行必须列出具体对象并进行二次确认；取消任务不能撤销已提交数据及 DDL。</div>`:'<p class="muted">追加前检查目标结构；不支持的类型、精度溢出和结构冲突必须阻断，不静默截断或降级。</p>'}`)}<section class="panel"><div class="panel-title"><h2>高级参数</h2><span class="muted">初始示例参数，吞吐与资源上限须实测</span></div><div class="mapping-foot">${[['batch','源读取批次（行）'],['commit','目标提交批次（行）'],['threads','写入并发数'],['memory','LOB 缓存上限（MB）']].map(([k,l])=>`<div class="field"><label for="${k}">${l}</label><input id="${k}" type="number" min="1" data-bind="${k}" value="${state[k]}"></div>`).join('')}</div><div class="panel-body muted">大字段使用流式读写与有界缓存。无稳定唯一键的表不能承诺通用断点续传；提交结果不明确时先核对，禁止盲目重试。</div></section></div>`;}
    function checkStep(){return `<div class="stack"><div class="row between"><p class="muted">正式预检查只读取元数据和评估，不执行目标 DDL / DML。</p><button data-action="precheck">查看预检查示意</button></div><div class="checks"><div class="check-count"><strong>${chosen().filter(o=>o.type==='表').length}</strong><span>示例普通表<br><span class="muted">可进入迁移评估</span></span></div><div class="check-count"><strong>2</strong><span>关注事项<br><span class="muted">一致性、大字段</span></span></div><div class="check-count"><strong>${blocked()?1:0}</strong><span>${blocked()?'阻断项':'示例阻断项'}<br><span class="muted">实际结果待后端检测</span></span></div></div>${blocked()?'<div class="notice bad">示例阻断：PROC_SETTLEMENT 尚未转换并通过编译校验。请返回对象选择移除该过程；正式版可在修复后重新评估。</div>':'<div class="notice">当前所选示例对象没有演示阻断项。这不是数据库检查通过；正式版必须完成真实版本、权限、类型及对象冲突检查。</div>'}<section class="panel"><div class="panel-title"><h2>检查明细示意</h2><span class="chip neutral">未连接数据库</span></div><div class="table-wrap"><table><thead><tr><th>级别</th><th>检查项</th><th>范围 / 问题</th><th>处理要求</th></tr></thead><tbody><tr><td><span class="chip neutral">待检测</span></td><td>版本、字符集、权限</td><td>源端读取权限，目标建表与写入权限</td><td>正式检查不通过时阻断</td></tr><tr><td><span class="chip neutral">待检测</span></td><td>同名对象与结构兼容</td><td>${escapeHtml(state.schema)} · ${strategyLabel()}</td><td>按明确策略处理</td></tr><tr><td><span class="chip warn">需确认</span></td><td>一致性窗口</td><td>源库停写，目标对象禁止并发写入</td><td>执行前确认</td></tr><tr><td><span class="chip warn">需关注</span></td><td>大字段及类型语义</td><td>LOB 流式读取；长度、精度、空字符串、时区</td><td>迁移后进行内容校验</td></tr>${blocked()?'<tr><td><span class="chip bad">示例阻断</span></td><td>复杂对象</td><td class="mono">PROC_SETTLEMENT</td><td>人工转换并通过目标编译校验</td></tr>':''}</tbody></table></div></section><div class="row"><button data-action="ddl">查看 DDL 对照示意</button><span class="muted">配置改变后，正式版要求重新预检查，不沿用旧结果。</span></div></div>`;}
    function reviewStep(){return `<div class="stack"><div class="notice warn">最后核对源 / 目标方向及影响范围。正式版点击“开始迁移”后由后台执行，关闭页面不终止任务。</div>${panel('任务审阅', `<dl class="kv"><dt>任务名称</dt><dd>${escapeHtml(state.name)}</dd><dt>迁移方向</dt><dd><span class="chip">${directions[state.direction]}</span>　全量离线</dd><dt>源连接 / 模式</dt><dd>${pair()[0]}源连接（示例） / APP_SOURCE</dd><dt>目标连接 / 模式</dt><dd>${pair()[1]}目标连接（示例） / ${escapeHtml(state.schema)}</dd><dt>迁移范围</dt><dd>${state.scope} · ${state.selected.length} 个对象</dd><dt>目标冲突策略</dt><dd>${strategyLabel()}</dd><dt>校验方式</dt><dd>结构、对象、行数及内容校验；LOB 长度与摘要。只对比行数不能判定数据一致。</dd><dt>取消与恢复</dt><dd>回滚未提交批次；已提交数据及 DDL 不保证回退。仅满足稳定键与幂等条件的对象可恢复。</dd></dl>`)}<section class="panel"><div class="panel-title"><h2>目标影响清单</h2><span class="muted">示例 · 实际清单由预检查生成</span></div><div class="table-wrap"><table><thead><tr><th>源对象</th><th>目标对象</th><th>类型</th><th>拟执行策略</th></tr></thead><tbody>${chosen().map(o=>`<tr><td class="mono">APP_SOURCE.${o.name}</td><td class="mono">${escapeHtml(state.schema)}.${o.name}</td><td>${o.type}</td><td>${strategyLabel()}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">尚未选择对象</td></tr>'}</tbody></table></div></section>${['truncate','rebuild'].includes(state.strategy)?'<div class="notice bad">危险策略已选中。正式执行还需输入目标模式名称并再次确认不可恢复的目标改动。本样稿不执行该操作。</div>':''}<label class="row"><input id="reviewed" type="checkbox" ${state.reviewed?'checked':''}>已核对方向、停写条件、对象清单及目标修改风险（样稿演示确认）</label><p class="muted">本页底部仅“查看执行示意”，不提交任务、不产生数据库改动。</p></div>`;}
    function runtimeBody(){if(state.tab==='对象')return `<div class="table-wrap"><table><thead><tr><th>对象</th><th>阶段</th><th>已提交行数</th><th>状态（示意）</th><th>操作</th></tr></thead><tbody>${chosen().map((o,i)=>`<tr><td class="mono">${o.name}</td><td>数据写入 / 等待调度</td><td>—</td><td><span class="chip ${state.runtime==='failed'&&i===0?'bad':'neutral'}">${state.runtime==='failed'&&i===0?'提交结果待核对':'等待后端统计'}</span></td><td><button class="text" data-action="object-info" data-object-name="${o.name}">详情</button></td></tr>`).join('')}</tbody></table></div>`;if(state.tab==='错误')return `<div class="panel-body"><div class="notice ${state.runtime==='failed'?'bad':''}">${state.runtime==='failed'?'异常示例：目标连接中断，最近批次的提交状态不确定。任务进入“待核对”，需核实目标数据后再决定恢复；不能直接重复写入。':'此处展示对象、批次、脱敏错误码、原因及处理建议。当前没有真实任务错误。'}</div></div>`;if(state.tab==='日志')return '<div class="panel-body"><div class="log">日志区域示意（非实际执行日志）\n[阶段] 连接、评估、创建结构、数据写入、依赖对象、校验\n[对象] 对象名称 / 批次 / 实际已提交行数 / 脱敏异常\n[安全] 不记录连接口令或业务字段内容\n正式日志由后台持续更新，仅刷新此区域，不刷新整个工作区。</div></div>';if(state.tab==='校验')return `<div class="panel-body stack"><div class="notice warn">校验范围必须明确：抽样校验不能宣称全量一致；未校验或失败对象不能列为已验收。</div><div class="table-wrap"><table><thead><tr><th>项目</th><th>检查内容</th><th>结果</th></tr></thead><tbody><tr><td>结构与对象</td><td>列、精度、约束、索引、依赖对象编译</td><td>待真实任务校验</td></tr><tr><td>数据与 LOB</td><td>行数、规范化内容、LOB 长度及摘要</td><td>待真实任务校验</td></tr><tr><td>范围与例外</td><td>校验覆盖范围、跳过对象、差异清单</td><td>待真实任务记录</td></tr></tbody></table></div></div>`;if(state.tab==='报告')return `<div class="panel-body stack"><h3>迁移报告内容</h3><p>配置快照、实际版本与字符集、影响范围、对象结果、耗时与吞吐、校验覆盖范围、差异与异常、取消或恢复记录、操作审计。</p><div class="notice">当前没有真实报告。可下载带“样稿示例”标识的文本目录，供评审报告要素。</div><div><button data-action="report">下载报告示例</button></div></div>`;return `<div class="panel-body stack"><div class="detail-summary"><div><span class="muted">任务状态（示意）</span><strong>${({waiting:'等待后台执行',running:'运行中',stopping:'正在停止',failed:'待核对'})[state.runtime]}</strong></div><div><span class="muted">所选对象</span><strong>${state.selected.length}</strong></div><div><span class="muted">实际已提交行数</span><strong>—</strong></div><div><span class="muted">耗时 / 速率</span><strong>— / —</strong></div></div><div><h3>执行阶段</h3><div class="phase-row">${['连接','结构','数据','依赖对象','校验'].map(v=>`<span class="phase ${v==='数据'&&state.runtime==='running'?'active':''}">${v}</span>`).join('')}</div><p class="muted">未知总行数时显示阶段与已提交统计，不使用虚假的精确百分比。</p></div><div class="notice ${state.runtime==='failed'?'bad':'warn'}">${state.runtime==='failed'?'提交状态不明确：先核对，禁止盲目重试。':'取消只停止后续调度并回滚未提交批次；已经提交的数据与 DDL 不能承诺自动恢复。'}</div></div>`;}
    function resultStep(){return `<div class="stack"><div class="row between"><div class="row"><span class="chip neutral">执行界面示意 · 无真实任务</span><span class="muted">状态切换仅用于界面评审</span></div><div class="row"><label for="runtime">预览状态</label><select id="runtime" data-bind="runtime"><option value="waiting" ${state.runtime==='waiting'?'selected':''}>等待执行</option><option value="running" ${state.runtime==='running'?'selected':''}>运行中</option><option value="failed" ${state.runtime==='failed'?'selected':''}>异常 · 待核对</option><option value="stopping" ${state.runtime==='stopping'?'selected':''}>正在停止</option></select></div></div><section class="panel"><div class="panel-title"><h2>${escapeHtml(state.name)}</h2><span class="chip">${directions[state.direction]}</span></div><div class="tabs" role="tablist" aria-label="任务详情">${['总览','对象','错误','日志','校验','报告'].map(v=>`<button role="tab" aria-selected="${state.tab===v}" class="${state.tab===v?'active':''}" data-tab="${v}">${v}</button>`).join('')}</div>${runtimeBody()}</section><div class="row"><button class="danger" data-action="cancel-demo" ${state.runtime!=='running'?'disabled':''}>取消任务（示意）</button><span class="muted">刷新、离开和关闭页签不应结束真实后台任务。</span></div></div>`;}
    function listView(){let draft=null;try{draft=JSON.parse(localStorage.getItem('jddbms-migration-v0-draft'));}catch(_){}return `<div class="page-heading row between"><div><h1>数据迁移</h1><p class="muted">管理 DM / Oracle 全量离线迁移任务，查看执行状态与校验报告。</p></div><button class="primary" data-action="new">新建迁移</button></div>${sample}<section class="panel"><div class="toolbar row between"><span class="muted">没有真实迁移任务 · 此处仅显示本地样稿草稿</span><button data-action="restore" ${draft?'':'disabled'}>恢复本地样稿草稿</button></div><div class="table-wrap"><table><thead><tr><th>任务名称</th><th>方向</th><th>源 / 目标连接</th><th>状态</th><th>已提交行数</th><th>失败对象</th><th>操作</th></tr></thead><tbody>${draft?`<tr><td>${escapeHtml(draft.name)}</td><td>${directions[draft.direction]}</td><td>示例连接</td><td><span class="chip neutral">本地样稿草稿</span></td><td>—</td><td>—</td><td><button class="text" data-action="restore">继续编辑</button></td></tr>`:'<tr><td colspan="7" class="empty">还没有迁移任务<br>点击“新建迁移”，配置源端、目标端及迁移范围。</td></tr>'}</tbody></table></div></section><p class="muted" style="margin-top:16px">正式版任务列表提供方向 / 状态 / 关键词筛选与服务端分页。配置草稿与任务记录由后台持久化。</p>`;}
    function render(){const page=document.getElementById('page');if(state.view==='list'){page.innerHTML=listView();document.getElementById('footer').innerHTML='<span class="muted">样稿评审范围：配置流程、风险提示、任务详情布局。尚未进行数据库迁移验收。</span>';return;}page.innerHTML=`<div class="page-heading row between"><div><h1>${state.step===5?'迁移任务详情':'新建迁移'}</h1><p class="muted">${state.step===5?'后台持续执行 · 页面仅展示状态与验收结果':'先评估，再执行；明确每个对象的目标改动与校验结果。'}</p></div><button data-action="list">返回任务列表</button></div>${sample}<nav class="stepper" aria-label="迁移步骤">${steps.map((s,i)=>`<button class="step ${state.step===i?'active':''}" data-step="${i}" ${state.step===i?'aria-current="step"':''}><span class="step-num">${i+1}</span><span>${s}</span></button>`).join('')}</nav>${[connectionStep,objectStep,mappingStep,checkStep,reviewStep,resultStep][state.step]()}`;renderFooter();if(state.step===1)updateSelection();}
    function renderFooter(){let reason='';if(!canAdvance())reason=state.step===0?'填写任务名称并选择源 / 目标连接':state.step===1?'至少选择一个对象':state.step===2?'目标模式及参数必须有效':'存在示例阻断项，请返回处理';if(state.step===4&&(!state.reviewed||blocked()||!state.selected.length))reason='请先核对对象与风险；有阻断项时不能执行';document.getElementById('footer').innerHTML=`<div class="muted">步骤 ${state.step+1} / 6${state.step>0?' · 已选 '+state.selected.length+' 个对象':''}<span id="footer-reason" style="margin-left:12px">${reason}</span></div><div class="footer-actions">${state.step>0?'<button data-action="back">上一步</button>':''}<button data-action="save">保存草稿</button>${state.step===5?'<button class="primary" data-action="list">返回任务列表</button>':`<button class="primary" data-action="next" ${(!canAdvance()||(state.step===4&&(!state.reviewed||blocked()||!state.selected.length)))?'disabled':''}>${state.step===4?'查看执行示意':'下一步'}</button>`}</div>`;}
    function updateSelection(){const visible=visibleObjects();const checkbox=document.getElementById('select-visible');checkbox.checked=visible.length>0&&visible.every(o=>state.selected.includes(o.name));checkbox.indeterminate=visible.some(o=>state.selected.includes(o.name))&&!checkbox.checked;checkbox.disabled=!visible.length;document.getElementById('selected-count').textContent=`已选择 ${state.selected.length} 个对象`;renderFooter();}
    function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.hidden=true,3500);}
    function modal(title,content){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-content').innerHTML=content;document.getElementById('dialog').showModal();}
    function ddl(){const target=escapeHtml(state.schema);modal('DDL 对照 · 占位示意',`<div class="notice" style="margin-bottom:16px">只展示对照布局，不代表真实转换结果。实际 DDL 必须依据元数据生成并通过目标语法检查。</div><div class="grid2">${panel('源端 · APP_SOURCE',`<pre>-- ${pair()[0]} · 示例\nCREATE TABLE APP_SOURCE.CUSTOMERS (\n  ID NUMBER(18,0) NOT NULL,\n  NAME ${pair()[0]==='Oracle'?'VARCHAR2(120 CHAR)':'VARCHAR(120)'},\n  CREATED_AT TIMESTAMP(6),\n  CONSTRAINT PK_CUSTOMERS PRIMARY KEY(ID)\n);</pre>`)}${panel('目标端 · '+target,`<pre>-- ${pair()[1]} · 示例\nCREATE TABLE ${target}.CUSTOMERS (\n  ID NUMBER(18,0) NOT NULL,\n  NAME ${pair()[1]==='Oracle'?'VARCHAR2(120 CHAR)':'VARCHAR(120)'},\n  CREATED_AT TIMESTAMP(6),\n  CONSTRAINT PK_CUSTOMERS PRIMARY KEY(ID)\n);</pre>`)}</div>`);}
    document.addEventListener('click',e=>{
      const button=e.target.closest('button');if(!button)return;
      if(button.dataset.step!==undefined){state.step=Number(button.dataset.step);state.view='wizard';render();return;}
      if(button.dataset.direction!==undefined){state.direction=Number(button.dataset.direction);state.reviewed=false;render();return;}
      if(button.dataset.kind){state.kind=button.dataset.kind;render();return;}
      if(button.dataset.tab){state.tab=button.dataset.tab;render();return;}
      if(button.dataset.density){state.density=button.dataset.density;const values={compact:[12,7,12],standard:[16,10,16],relaxed:[24,14,24]}[state.density];['--pad','--cell','--gap'].forEach((k,i)=>document.documentElement.style.setProperty(k,values[i]+'px'));document.querySelectorAll('[data-density]').forEach(b=>b.classList.toggle('selected',b.dataset.density===state.density));return;}
      switch(button.dataset.action){
        case 'list':state.view='list';render();break;
        case 'new':Object.assign(state,initialState(),{density:state.density});render();break;
        case 'back':state.step=Math.max(0,state.step-1);render();break;
        case 'next':if(button.disabled)return;state.step=Math.min(5,state.step+1);render();break;
        case 'clear-selection':state.selected=[];state.reviewed=false;render();break;
        case 'save':try{localStorage.setItem('jddbms-migration-v0-draft',JSON.stringify({...state,reviewed:false,step:Math.min(4,state.step)}));showToast('草稿仅保存到本地样稿，不包含账号口令，不是后台任务。');}catch(_){showToast('浏览器禁止本地存储，草稿未保存。');}break;
        case 'restore':try{const draft=JSON.parse(localStorage.getItem('jddbms-migration-v0-draft'));if(!draft)throw Error();Object.assign(state,draft,{view:'wizard',reviewed:false});render();showToast('已恢复本地样稿草稿；执行确认需要重新勾选。');}catch(_){showToast('没有可恢复的本地样稿草稿。');}break;
        case 'connection':{const source=button.dataset.role==='source';modal((source?'源端':'目标端')+'连接信息（只读示例）',`<div class="notice" style="margin-bottom:16px">这里只查看已保存的连接，不能修改账号、地址等信息。实际连接行为将在正式版实现。</div><div class="grid2">${[['数据库类型',pair()[source?0:1]],['连接名',pair()[source?0:1]+(source?'源':'目标')+'连接（示例）'],['服务器地址','示例占位，不含真实地址'],['端口','待连接配置'],['账号','未提供'],['口令','••••••••']].map(([l,v])=>`<div class="field"><label>${l}</label><input readonly value="${v}"></div>`).join('')}</div>`);break;}
        case 'ddl':ddl();break;
        case 'precheck':showToast('预检查布局示意已展示；没有调用数据库或执行 SQL。');break;
        case 'object-info':{const object=objects.find(o=>o.name===button.dataset.objectName);modal('对象详情（示例）',`<dl class="kv"><dt>名称</dt><dd class="mono">APP_SOURCE.${object.name}</dd><dt>类型</dt><dd>${object.type}</dd><dt>关注事项</dt><dd>${object.note}</dd><dt>元数据 / 进度</dt><dd>正式版由后台按需加载。本样稿没有真实元数据与执行结果。</dd></dl>`);break;}
        case 'cancel-demo':state.runtime='stopping';render();showToast('已切换到“正在停止”示意；没有取消真实任务。');break;
        case 'report':{const content=`数据迁移报告 · 样稿示例（非真实迁移结果）\n任务：${state.name}\n方向：${directions[state.direction]}\n范围：${state.scope}\n示例对象：${state.selected.join(', ')}\n\n正式报告要素：\n配置快照、真实版本与字符集、目标影响范围、对象执行结果、已提交行数、耗时与吞吐、校验方法与覆盖范围、差异清单、取消及恢复记录、脱敏日志、操作审计。\n\n本文件不代表迁移成功、数据一致或商业验收通过。`;const url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='数据迁移报告-样稿示例.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}
        case 'tweaks':{const panel=document.getElementById('tweaks');panel.hidden=!panel.hidden;document.querySelector('.tweaks-trigger').setAttribute('aria-expanded',String(!panel.hidden));break;}
        case 'close-dialog':document.getElementById('dialog').close();break;
      }
    });
    document.addEventListener('input',e=>{
      if(e.target.id==='object-search'){state.filter=e.target.value;document.getElementById('object-rows').innerHTML=objectRows();updateSelection();return;}
      const key=e.target.dataset.bind;if(key&&e.target.tagName==='INPUT'){state[key]=e.target.value;state.reviewed=false;renderFooter();}
    });
    document.addEventListener('change',e=>{
      const key=e.target.dataset.bind;if(key&&e.target.tagName==='SELECT'){state[key]=e.target.value;state.reviewed=false;render();return;}
      if(e.target.id==='reviewed'){state.reviewed=e.target.checked;renderFooter();return;}
      if(e.target.dataset.object){const name=e.target.dataset.object;state.selected=e.target.checked?[...new Set([...state.selected,name])]:state.selected.filter(v=>v!==name);state.reviewed=false;updateSelection();}
      if(e.target.id==='select-visible'){const names=visibleObjects().map(o=>o.name);state.selected=e.target.checked?[...new Set([...state.selected,...names])]:state.selected.filter(v=>!names.includes(v));state.reviewed=false;render();}
    });
    render();
  </script>
</body>
</html>
