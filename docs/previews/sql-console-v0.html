<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQL 控制台布局样稿</title>
<style>
:root{--primary:#006fff;--text:#303133;--muted:#68728c;--border:#e5e9f2;--surface:#f5f7fa;--gap:16px;--radius:4px}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--text);font:14px "Microsoft YaHei",sans-serif}.app{margin:24px;max-width:1200px;background:white;border:1px solid var(--border);border-radius:var(--radius)}header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;gap:24px;align-items:center}label{color:var(--muted);display:flex;gap:8px;align-items:center}select,button{font:inherit;border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;background:white;color:var(--text)}select{min-width:180px}.toolbar{padding:12px 20px;display:flex;gap:8px;border-bottom:1px solid var(--border)}.primary{background:var(--primary);border-color:var(--primary);color:white}.spacer{flex:1}pre{margin:0;min-height:280px;padding:24px;background:white;font:15px/1.8 Consolas,monospace;color:#2155a4}.divider{height:8px;background:var(--surface);border-block:1px solid var(--border)}.results{padding:16px 20px;min-height:200px}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);padding-bottom:12px}.active{color:var(--primary)}.placeholder{padding:40px;text-align:center;color:var(--muted)}footer{padding:10px 20px;background:var(--surface);color:var(--muted);font-size:12px}.note{margin:20px 24px;color:var(--muted)}@media(max-width:800px){header,.toolbar{flex-wrap:wrap}.app{margin:12px}.spacer{display:none}}
</style>
<p class="note">布局样稿 · 示例字段和 SQL 仅用于说明位置，最终显示实际连接与查询结果。</p>
<main class="app">
<header><strong>SQL 控制台</strong><label>数据源 <select><option>[当前窗口的数据源]</option></select></label><label>当前模式 <select><option>[可搜索的模式选择]</option></select></label></header>
<section class="toolbar"><button class="primary">执行选中 / 当前语句</button><button>执行全部</button><button disabled>停止</button><button>格式化</button><span class="spacer"></span><button>保存脚本</button><button>历史</button><button>更多</button><button>执行设置</button></section>
<pre>1  SELECT t.*
2    FROM [当前模式].[表名] t
3   WHERE [查询条件];
4
5  -- 关键字、表名、别名字段按当前窗口上下文补齐</pre>
<div class="divider" title="上下拖动调整编辑区和结果区"></div>
<section class="results"><div class="tabs"><span class="active">结果 1</span><span>结果 2</span><span>执行消息</span><span class="spacer"></span><span>批量执行：逐条显示成功 / 失败</span></div><div class="placeholder">[结果表格 / 无结果提示 / 执行错误]</div></section>
<footer>就绪 · [数据源 / 当前模式] · [执行耗时 / 行数 / 事务状态]</footer>
</main></html>
