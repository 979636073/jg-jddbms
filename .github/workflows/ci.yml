name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jd-dbms-ui
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: jd-dbms-ui/.nvmrc
          cache: npm
          cache-dependency-path: jd-dbms-ui/package-lock.json
      - run: npm ci
      - run: npm run lint -- --quiet
      - run: npm run test:core
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: jd-dbms-ui/dist
