server {
    listen 80;
    listen 28080;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:28081;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
