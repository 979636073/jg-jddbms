# 项目相关配置
dbms:
  # 名称
  name: JDDBMS
  # 版本profile
  version: 3.8.7
  # 版权年份
  copyrightYear: 2023
  #  profile: /home/dbms/path
  profile: D:/uploadPath/JDDBMS
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
chat2db:
  version: 3.8.7
  gateway:
    base-url: http://test.sqlgpt.cn/gateway
    model-base-url: http://test.sqlgpt.cn/gateway
# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 28080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
      # 入参最大限制放开
    max-http-form-post-size: -1

# 日志配置
logging:
  level:
    com.jd: ${JDDBMS_LOG_LEVEL:info}
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 1

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 4096MB
      # 设置总上传的文件大小
      max-request-size: 4096MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  #  用于数据库表结构版本管理
  flyway:
    enabled: false
  # redis 配置
  redis:
    # 地址
    host: ${JDDBMS_REDIS_HOST:localhost}
    #    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: ${JDDBMS_REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${JDDBMS_TOKEN_SECRET}
  # 令牌有效期（默认30分钟）,这边默认设置成1年
  expireTime: 518400
jddbms:
  datasource-encryption-key: ${JDDBMS_DATASOURCE_ENCRYPTION_KEY}
sso:
  gateway: false
# MyBatis配置
# MyBatis Plus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.jd.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/api/*
# Print the HTTP log
logbook:
  include:
    - /api/**

# Http Client
forest:
  connect-timeout: 30000
  log-response-content: true
  read-timeout: 30000
  timeout: 30000

exportDmp:
  dm: ${JDDBMS_DM_EXPORT_TOOL:dexp}
  #  dm: /opt/dmdbms/bin/dexp
  oracle: ${JDDBMS_ORACLE_EXPORT_TOOL:exp}
dmp:
  dm:
    user: ${JDDBMS_DM_DMP_USER:}
    password: ${JDDBMS_DM_DMP_PASSWORD:}
  oracle:
    user: ${JDDBMS_ORACLE_DMP_USER:}
    password: ${JDDBMS_ORACLE_DMP_PASSWORD:}

importDmp:
  dm: ${JDDBMS_DM_IMPORT_TOOL:dimp}
  #  dm: /opt/dmdbms/bin/dimp
  oracle: ${JDDBMS_ORACLE_IMPORT_TOOL:imp}

pigenhole:
  #  uploadUrl: /home/dbms/uploadUrl
  uploadUrl: D:/uploadPath/JDDBMS/uploadUrl
