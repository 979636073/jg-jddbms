spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: org.h2.Driver
    druid:
      master:
        url: jdbc:h2:file:${JDDBMS_DATA_DIR:./data/h2}/jddbms;MODE=MySQL;DATABASE_TO_UPPER=TRUE;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS JDDBMS\;SET SCHEMA JDDBMS
        username: sa
        password: ''
      slave:
        enabled: false
      validationQuery: SELECT 1
